<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoleSafe — School Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#4361ee,#3a0ca3)}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;max-width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{color:#4361ee;text-align:center;margin-bottom:4px;font-size:28px}
.login-box .sub{text-align:center;color:#888;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-weight:500;color:#555;font-size:14px}
input{width:100%;padding:12px 14px;border:2px solid #ddd;border-radius:8px;font-size:15px;transition:border-color .2s}
input:focus{outline:none;border-color:#4361ee}
.btn{width:100%;padding:14px;background:#4361ee;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#3a56d4}
.btn-sm{padding:8px 14px;width:auto;font-size:13px}
.btn-outline{background:transparent;border:2px solid #4361ee;color:#4361ee}
.btn-outline:hover{background:#4361ee;color:#fff}
.btn-danger{background:#e74c3c}
.btn-danger:hover{background:#c0392b}
.btn-success{background:#27ae60}
.btn-success:hover{background:#219a52}
.dashboard{display:none}
.topbar{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.topbar h2{color:#4361ee;font-size:20px}
.topbar .school-name{color:#666;font-size:14px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.container{max-width:1200px;margin:0 auto;padding:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-card .stat-label{color:#888;font-size:13px;margin-bottom:4px}
.stat-card .stat-value{color:#4361ee;font-size:28px;font-weight:700}
.section{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.section h3{color:#4361ee;margin-bottom:16px;font-size:18px;border-bottom:2px solid #f0f2f5;padding-bottom:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:13px;color:#888;border-bottom:2px solid #f0f2f5;font-weight:600}
td{padding:10px 12px;border-bottom:1px solid #f0f2f5;font-size:14px}
tr:hover{background:#f8f9ff}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge-in_progress{background:#e3f2fd;color:#1976d2}
.badge-completed{background:#e8f5e9;color:#2e7d32}
.badge-confirmed{background:#fff3e0;color:#f57c00}
.badge-draft{background:#f5f5f5;color:#666}
.badge-open{background:#e8f5e9;color:#2e7d32}
.badge-cancelled{background:#ffebee;color:#c62828}
.badge-pending{background:#fff3e0;color:#f57c00}
.badge-verified{background:#e8f5e9;color:#2e7d32}
.empty-state{text-align:center;padding:40px;color:#999;font-size:14px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modal.open{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:32px;width:500px;max-width:90%;max-height:80vh;overflow-y:auto}
.modal-content h3{color:#4361ee;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal-actions .btn{width:auto}
.message{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;font-weight:500}
.message-success{background:#e8f5e9;color:#2e7d32;border-left:4px solid #2e7d32}
.message-error{background:#ffebee;color:#c62828;border-left:4px solid #c62828}
.loading{text-align:center;padding:24px;color:#999}
@media(max-width:768px){.container{padding:12px}.stats-grid{grid-template-columns:1fr 1fr}.topbar{flex-wrap:wrap;gap:8px}}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🏫 PoleSafe</h1>
    <p class="sub">School Admin Dashboard</p>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="+256700000000" required>
      </div>
      <div class="form-group">
        <label>PIN</label>
        <input type="password" id="pin" placeholder="4-digit PIN" required maxlength="4">
      </div>
      <button class="btn" type="submit">Login</button>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="dashboard">
  <div class="topbar">
    <div>
      <h2>🏫 <span id="schoolName">School Dashboard</span></h2>
      <span class="school-name" id="adminName"></span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-sm btn-outline" onclick="openModal('tripModal')">+ New Trip</button>
      <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div id="msgBox"></div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Active Trips -->
    <div class="section">
      <h3>🚐 Active Trips</h3>
      <div id="activeTrips"><div class="loading">Loading...</div></div>
    </div>

    <!-- All Trips -->
    <div class="section">
      <h3>📋 All Trips</h3>
      <div id="allTrips"><div class="loading">Loading...</div></div>
    </div>

    <!-- Drivers -->
    <div class="section">
      <h3>👨‍✈️ Drivers</h3>
      <div id="driversList"><div class="loading">Loading...</div></div>
    </div>

    <!-- Recent Payments -->
    <div class="section">
      <h3>💰 Recent Payments</h3>
      <div id="paymentsList"><div class="loading">Loading...</div></div>
    </div>
  </div>
</div>

<!-- New Trip Modal -->
<div id="tripModal" class="modal">
  <div class="modal-content">
    <h3>✏️ Create New Trip</h3>
    <form id="tripForm">
      <div class="form-group">
        <label>Trip Name</label>
        <input type="text" id="tripName" placeholder="e.g. Morning Pickup" required>
      </div>
      <div class="form-group">
        <label>Destination</label>
        <input type="text" id="tripDest" placeholder="e.g. St. Mary's School" required>
      </div>
      <div class="form-group">
        <label>Date & Time</label>
        <input type="datetime-local" id="tripDate" required>
      </div>
      <div class="form-group">
        <label>Maximum Seats</label>
        <input type="number" id="tripSeats" placeholder="e.g. 15" min="1" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-sm btn-outline" onclick="closeModal('tripModal')">Cancel</button>
        <button type="submit" class="btn btn-sm btn-success">Create Trip</button>
      </div>
    </form>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('schoolToken');
let user = null;
let schoolId = null;

function msg(text, type='success') {
  const box = document.getElementById('msgBox') || document.getElementById('loginMsg');
  box.innerHTML = `<div class="message message-${type}">${text}</div>`;
  setTimeout(() => box.innerHTML='', 5000);
}

async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const r = await fetch(`${API}${path}`, {...opts, headers:{...headers,...opts.headers}});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await api('/auth/login', {
      method:'POST',
      body:JSON.stringify({phone: document.getElementById('phone').value, pin: document.getElementById('pin').value})
    });
    if (d.user.role !== 'school_admin') throw new Error('School admin access only');
    token = d.token;
    localStorage.setItem('schoolToken', token);
    user = d.user;
    schoolId = d.user.schoolId;
    showDashboard();
  } catch(e) { msg(e.message, 'error'); }
});

function logout() {
  localStorage.removeItem('schoolToken');
  token = null;
  user = null;
  schoolId = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

async function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('adminName').textContent = `👤 ${user.name}`;

  try {
    const school = await api(`/schools/${schoolId}`);
    document.getElementById('schoolName').textContent = school.name || 'School Dashboard';
  } catch(e) {
    document.getElementById('schoolName').textContent = 'School Dashboard';
  }

  loadAll();
}

async function loadAll() {
  try {
    const [trips, drivers, payments] = await Promise.all([
      api('/trips'),
      api('/drivers'),
      api('/payments').catch(() => ({payments:[]}))
    ]);

    const active = trips.filter(t => ['open','confirmed','in_progress'].includes(t.status));
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="stat-label">Active Trips</div><div class="stat-value">${active.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total Trips</div><div class="stat-value">${trips.length}</div></div>
      <div class="stat-card"><div class="stat-label">Drivers</div><div class="stat-value">${drivers.length}</div></div>
      <div class="stat-card"><div class="stat-label">Kids Today</div><div class="stat-value">${active.reduce((s,t)=>s+(t.assignedKids?.length||0),0)}</div></div>
    `;

    renderTrips(active, 'activeTrips', true);
    renderTrips(trips, 'allTrips', false);
    renderDrivers(drivers);
    renderPayments(payments.payments || []);
  } catch(e) {
    msg('Failed to load: ' + e.message, 'error');
  }
}

function renderTrips(trips, elId, slim) {
  if (!trips.length) {
    document.getElementById(elId).innerHTML = `<div class="empty-state">No trips found</div>`;
    return;
  }
  const html = `<table><thead><tr>
    <th>Name</th>${slim?'':'<th>Dest</th>'}<th>Status</th><th>Kids</th><th>Date</th><th>Actions</th>
  </tr></thead><tbody>
    ${trips.map(t => `<tr>
      <td><strong>${t.name}</strong></td>
      ${slim?'':`<td>${t.destination||'-'}</td>`}
      <td><span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span></td>
      <td>${t.assignedKids?.length||0}/${t.maxSeats||'-'}</td>
      <td>${t.dateTime ? new Date(t.dateTime).toLocaleDateString() : '-'}</td>
      <td>
        ${['open','confirmed','in_progress'].includes(t.status)?
          `<button class="btn btn-sm" onclick="tripAction('${t._id}','complete')">Complete</button>`:''}
        ${t.status==='draft'||t.status==='open'?
          `<button class="btn btn-sm btn-danger" onclick="tripAction('${t._id}','cancel')">Cancel</button>`:''}
      </td>
    </tr>`).join('')}
  </tbody></table>`;
  document.getElementById(elId).innerHTML = html;
}

function renderDrivers(drivers) {
  if (!drivers.length) {
    document.getElementById('driversList').innerHTML = `<div class="empty-state">No drivers assigned</div>`;
    return;
  }
  const html = `<table><thead><tr>
    <th>Name</th><th>Phone</th><th>Vehicle</th><th>Status</th><th>Rating</th>
  </tr></thead><tbody>
    ${drivers.map(d => `<tr>
      <td><strong>${d.name}</strong></td>
      <td>${d.phone||'-'}</td>
      <td>${d.vehicleType||'-'}</td>
      <td><span class="badge badge-${d.availability?'verified':'pending'}">${d.availability?'Available':'Unavailable'}</span></td>
      <td>${d.rating ? '⭐'.repeat(Math.round(d.rating)) : '-'}</td>
    </tr>`).join('')}
  </tbody></table>`;
  document.getElementById('driversList').innerHTML = html;
}

function renderPayments(payments) {
  if (!payments.length) {
    document.getElementById('paymentsList').innerHTML = `<div class="empty-state">No payments yet</div>`;
    return;
  }
  const html = `<table><thead><tr>
    <th>Reference</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th>
  </tr></thead><tbody>
    ${payments.slice(0,10).map(p => `<tr>
      <td>${p.reference||'-'}</td>
      <td><strong>${p.amount||0} UGX</strong></td>
      <td>${p.method||'MoMo'}</td>
      <td><span class="badge badge-${p.status==='completed'?'verified':'pending'}">${p.status}</span></td>
      <td>${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '-'}</td>
    </tr>`).join('')}
  </tbody></table>`;
  document.getElementById('paymentsList').innerHTML = html;
}

async function tripAction(id, action) {
  const confirmMsg = action==='cancel' ? 'Cancel this trip?' : 'Complete this trip?';
  if (!confirm(confirmMsg)) return;
  try {
    await api(`/trips/${id}/${action}`, {method:'POST'});
    msg(`Trip ${action}ed successfully`);
    loadAll();
  } catch(e) { msg(e.message, 'error'); }
}

// Modal helpers
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.getElementById('tripForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    name: document.getElementById('tripName').value,
    destination: document.getElementById('tripDest').value,
    dateTime: document.getElementById('tripDate').value,
    maxSeats: parseInt(document.getElementById('tripSeats').value),
  };
  try {
    await api('/trips', {method:'POST', body:JSON.stringify(data)});
    msg('Trip created!');
    closeModal('tripModal');
    document.getElementById('tripForm').reset();
    loadAll();
  } catch(e) { msg(e.message, 'error'); }
});

// Auto-login
if (token) {
  api('/auth/me').then(d => {
    if (d.user.role !== 'school_admin') throw new Error('Not a school admin');
    user = d.user;
    schoolId = d.user.schoolId;
    showDashboard();
  }).catch(() => { localStorage.removeItem('schoolToken'); token=null; });
}
</script>
</body>
</html>
