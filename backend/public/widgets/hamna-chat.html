<!-- Hamna Chat Widget — Web Dashboard AI Assistant -->
<!-- Embed this in any admin dashboard page to give users access to Hamna -->
<!-- Usage: <script src="/widgets/hamna-chat.js"></script> -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ============================================
       Hamna Chat Widget Styles
       ============================================ */
    .hamna-widget * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .hamna-widget {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    }

    /* Floating Button */
    .hamna-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: #4361ee;
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(67, 97, 238, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      z-index: 9999;
      transition: all 0.3s ease;
      animation: hamna-pulse 2s infinite;
    }

    .hamna-fab:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(67, 97, 238, 0.5);
    }

    .hamna-fab.open {
      animation: none;
    }

    .hamna-badge {
      position: fixed;
      bottom: 72px;
      right: 20px;
      background: #ff6b6b;
      color: #fff;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      z-index: 9999;
    }

    /* Chat Panel */
    .hamna-panel {
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 380px;
      height: 560px;
      background: #f8f9ff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
      animation: hamna-slide-up 0.3s ease;
    }

    .hamna-panel.open {
      display: flex;
    }

    /* Header */
    .hamna-header {
      background: #4361ee;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .hamna-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamna-avatar {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    .hamna-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .hamna-status {
      font-size: 11px;
      opacity: 0.85;
    }

    .hamna-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.8;
    }

    .hamna-close:hover {
      opacity: 1;
    }

    /* Messages */
    .hamna-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hamna-message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      animation: hamna-fade-in 0.3s ease;
    }

    .hamna-message.user {
      background: #4361ee;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .hamna-message.bot {
      background: #fff;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #e8e8f0;
    }

    .hamna-message.bot .sender {
      font-size: 11px;
      font-weight: 600;
      color: #4361ee;
      margin-bottom: 4px;
      display: block;
    }

    .hamna-typing {
      align-self: flex-start;
      padding: 12px 16px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8f0;
      display: flex;
      gap: 4px;
    }

    .hamna-typing span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: hamna-bounce 1.5s infinite;
    }

    .hamna-typing span:nth-child(2) { animation-delay: 0.2s; }
    .hamna-typing span:nth-child(3) { animation-delay: 0.4s; }

    /* Quick Actions */
    .hamna-quick-actions {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      flex-wrap: wrap;
    }

    .hamna-quick-btn {
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #e0e0eb;
      border-radius: 20px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hamna-quick-btn:hover {
      background: #e8e8f5;
      border-color: #4361ee;
      color: #4361ee;
    }

    /* Input */
    .hamna-input-area {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
    }

    .hamna-input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #e0e0eb;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      background: #f0f0f5;
    }

    .hamna-input:focus {
      border-color: #4361ee;
      background: #fff;
    }

    .hamna-send {
      width: 42px;
      height: 42px;
      border-radius: 21px;
      background: #4361ee;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s;
    }

    .hamna-send:hover {
      background: #3651d4;
    }

    .hamna-send:disabled {
      background: #b0b0c0;
      cursor: not-allowed;
    }

    /* Animations */
    @keyframes hamna-pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(67, 97, 238, 0.4); }
      50% { box-shadow: 0 4px 30px rgba(67, 97, 238, 0.6); }
    }

    @keyframes hamna-slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes hamna-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes hamna-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .hamna-panel {
        width: 100%;
        height: 100%;
        bottom: 0;
        right: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="hamna-widget">
    <!-- Floating Button -->
    <button class="hamna-fab" id="hamnaFab" onclick="toggleHamna()" title="Ask Hamna">
      💬
    </button>

    <!-- Chat Panel -->
    <div class="hamna-panel" id="hamnaPanel">
      <!-- Header -->
      <div class="hamna-header">
        <div class="hamna-header-left">
          <div class="hamna-avatar">H</div>
          <div>
            <h3>Hamna</h3>
            <span class="hamna-status">🟢 Online · AI Assistant</span>
          </div>
        </div>
        <button class="hamna-close" onclick="toggleHamna()">×</button>
      </div>

      <!-- Messages -->
      <div class="hamna-messages" id="hamnaMessages">
        <div class="hamna-message bot">
          <span class="sender">Hamna</span>
          Hey! I'm Hamna 👋 Your PoleSafe assistant. Ask me anything about your school transport!
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="hamna-quick-actions" id="hamnaQuickActions">
        <button class="hamna-quick-btn" onclick="quickAsk('Where is my child?')">📍 Where?</button>
        <button class="hamna-quick-btn" onclick="quickAsk('Book a ride')">🚐 Book</button>
        <button class="hamna-quick-btn" onclick="quickAsk('My child is sick')">🤒 Sick</button>
        <button class="hamna-quick-btn" onclick="quickAsk('I need help')">🆘 Help</button>
      </div>

      <!-- Input -->
      <div class="hamna-input-area">
        <input
          class="hamna-input"
          id="hamnaInput"
          type="text"
          placeholder="Ask Hamna anything..."
          onkeypress="if(event.key==='Enter') sendHamna()"
        />
        <button class="hamna-send" id="hamnaSendBtn" onclick="sendHamna()">➤</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // Hamna Chat Widget — JavaScript
    // ============================================

    let isOpen = false;
    let isLoading = false;

    function toggleHamna() {
      isOpen = !isOpen;
      document.getElementById('hamnaPanel').classList.toggle('open', isOpen);
      document.getElementById('hamnaFab').classList.toggle('open', isOpen);
      document.getElementById('hamnaFab').textContent = isOpen ? '✕' : '💬';

      if (isOpen) {
        document.getElementById('hamnaInput').focus();
      }
    }

    function quickAsk(message) {
      document.getElementById('hamnaInput').value = message;
      sendHamna();
    }

    async function sendHamna() {
      const input = document.getElementById('hamnaInput');
      const text = input.value.trim();

      if (!text || isLoading) return;

      input.value = '';
      isLoading = true;

      // Add user message
      addMessage(text, 'user');

      // Show typing indicator
      showTyping(true);

      const sendBtn = document.getElementById('hamnaSendBtn');
      sendBtn.innerHTML = '⏳';
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/hamna/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getToken(),
          },
          body: JSON.stringify({ message: text }),
        });

        const data = await response.json();
        showTyping(false);
        addMessage(data.response || 'Sorry, Hamna is having trouble.', 'bot');
      } catch (err) {
        showTyping(false);
        addMessage('Sorry, Hamna is having trouble right now. Please try again.', 'bot');
      } finally {
        isLoading = false;
        sendBtn.innerHTML = '➤';
        sendBtn.disabled = false;
        document.getElementById('hamnaInput').focus();
      }
    }

    function addMessage(text, sender) {
      const container = document.getElementById('hamnaMessages');
      const msg = document.createElement('div');
      msg.className = 'hamna-message ' + sender;

      if (sender === 'bot') {
        msg.innerHTML = '<span class="sender">Hamna</span>' + escapeHtml(text);
      } else {
        msg.textContent = text;
      }

      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping(show) {
      const container = document.getElementById('hamnaMessages');
      const existing = document.querySelector('.hamna-typing');

      if (existing) existing.remove();

      if (show) {
        const typing = document.createElement('div');
        typing.className = 'hamna-typing';
        typing.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(typing);
        container.scrollTop = container.scrollHeight;
      }
    }

    function getToken() {
      // Get auth token from your app's storage/cookie
      return localStorage.getItem('polesafe_token') || '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
